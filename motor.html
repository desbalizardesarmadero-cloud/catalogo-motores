<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desbalizar S.A. — Detalle del Motor</title>

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       DESIGN TOKENS & RESET — idénticos al catálogo
       ============================================================ */
    :root {
      --brand-blue:      #0B3C78;
      --brand-blue-mid:  #1554A8;
      --brand-blue-glow: #2277DD;
      --accent:          #3A9BFF;
      --accent-warm:     #F0A500;
      --dark-900:        #0A0D14;
      --dark-800:        #10141F;
      --dark-700:        #161C2E;
      --dark-600:        #1F2840;
      --dark-500:        #2A3450;
      --dark-400:        #3C4A68;
      --metal-light:     #8BA0C4;
      --metal-mid:       #5E7299;
      --text-primary:    #EDF2FF;
      --text-secondary:  #9BADC8;
      --text-muted:      #5E7299;
      --white:           #FFFFFF;
      --success:         #22C55E;
      --error:           #EF4444;
      --transition:      0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark-900);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    img  { display: block; max-width: 100%; }
    a    { text-decoration: none; color: inherit; }
    button { cursor: pointer; border: none; background: none; font-family: inherit; }

    /* Noise texture */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 0;
    }

    /* ============================================================
       HEADER
       ============================================================ */
    .site-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10, 13, 20, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(58,155,255,0.12);
      padding: 0 clamp(16px, 4vw, 64px);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header-logo-img {
      height: 44px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(58,155,255,0.25));
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(58,155,255,0.07);
      border: 1px solid rgba(58,155,255,0.18);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      transition: all var(--transition);
    }

    .btn-back:hover {
      background: rgba(58,155,255,0.14);
      border-color: rgba(58,155,255,0.35);
    }

    .btn-back svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* ============================================================
       LOADING / ERROR STATES
       ============================================================ */
    .page-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 20px;
    }

    .spinner {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 3px solid rgba(58,155,255,0.15);
      border-top-color: var(--accent);
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 14px;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ============================================================
       MAIN LAYOUT
       ============================================================ */
    .page-main {
      max-width: 1200px;
      margin: 0 auto;
      padding: clamp(24px, 4vw, 48px) clamp(16px, 4vw, 48px) 80px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(24px, 4vw, 48px);
      align-items: start;
    }

    @media (max-width: 820px) {
      .page-main { grid-template-columns: 1fr; }
    }

    /* ============================================================
       CARRUSEL DE IMÁGENES
       ============================================================ */
    .carousel-section {
      position: sticky;
      top: 84px;
    }

    @media (max-width: 820px) {
      .carousel-section { position: static; }
    }

    .carousel-main {
      position: relative;
      aspect-ratio: 4 / 3;
      border-radius: 14px;
      overflow: hidden;
      background: var(--dark-700);
      border: 1px solid rgba(58,155,255,0.1);
    }

    .carousel-main-img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      transition: opacity 0.28s ease, transform 0.55s cubic-bezier(0.4,0,0.2,1);
    }

    /* Nav arrows */
    .carousel-btn {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      z-index: 5;
      width: 40px; height: 40px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      transition: all var(--transition);
    }

    .carousel-btn:hover { background: rgba(58,155,255,0.5); border-color: var(--accent); }
    .carousel-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; }
    .carousel-btn.prev { left: 12px; }
    .carousel-btn.next { right: 12px; }
    .carousel-btn.hidden { display: none; }

    /* Indicador de foto */
    .carousel-counter {
      position: absolute;
      bottom: 12px; right: 14px;
      z-index: 5;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
    }

    /* Thumbnail strip */
    .carousel-thumbs {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .carousel-thumbs::-webkit-scrollbar { display: none; }

    .carousel-thumb {
      flex-shrink: 0;
      width: 68px; height: 52px;
      border-radius: 8px;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid transparent;
      opacity: 0.5;
      transition: all var(--transition);
    }

    .carousel-thumb.active,
    .carousel-thumb:hover { opacity: 1; border-color: var(--accent); }

    /* Placeholder sin foto */
    .carousel-placeholder {
      width: 100%; aspect-ratio: 4/3;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .carousel-placeholder svg {
      width: 48px; height: 48px;
      stroke: var(--dark-400); fill: none; stroke-width: 1.4;
    }

    /* ============================================================
       PANEL DERECHO — info del motor
       ============================================================ */
    .info-panel {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Breadcrumb */
    .breadcrumb {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .breadcrumb a { color: var(--accent); transition: color var(--transition); }
    .breadcrumb a:hover { color: var(--white); }
    .breadcrumb-sep { color: var(--dark-400); }

    /* Título */
    .motor-brand {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(40px, 7vw, 64px);
      font-weight: 800;
      text-transform: uppercase;
      line-height: 0.95;
      color: var(--white);
      letter-spacing: 0.01em;
    }

    .motor-model {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(18px, 3vw, 26px);
      font-weight: 500;
      text-transform: uppercase;
      color: var(--accent);
      letter-spacing: 0.1em;
      margin-top: 4px;
    }

    /* Badge disponible */
    .badge-disponible {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.3);
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #4ADE80;
      width: fit-content;
    }

    .badge-disponible::before {
      content: '';
      width: 7px; height: 7px;
      background: #4ADE80;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 6px rgba(74,222,128,0.8);
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }

    /* ============================================================
       SPECS GRID
       ============================================================ */
    .specs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .spec-card {
      background: var(--dark-700);
      border: 1px solid rgba(58,155,255,0.08);
      border-radius: 12px;
      padding: 14px 16px;
      transition: border-color var(--transition);
    }

    .spec-card:hover { border-color: rgba(58,155,255,0.22); }

    .spec-card-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .spec-card-value {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1;
    }

    /* ============================================================
       DESCRIPCIÓN ESPECÍFICA
       ============================================================ */
    .section-block {
      background: var(--dark-800);
      border: 1px solid rgba(58,155,255,0.07);
      border-radius: 14px;
      padding: 20px;
    }

    .section-block-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-block-title::before {
      content: '';
      width: 3px; height: 16px;
      background: var(--accent);
      border-radius: 2px;
      flex-shrink: 0;
    }

    .motor-descripcion {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-secondary);
    }

    /* ============================================================
       DESCRIPCIÓN GENERAL FIJA (para todos los motores)
       ============================================================ */
    .garantia-block {
      background: linear-gradient(135deg, rgba(11,60,120,0.25) 0%, rgba(21,84,168,0.12) 100%);
      border: 1px solid rgba(58,155,255,0.15);
      border-radius: 14px;
      padding: 20px;
    }

    .garantia-intro {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.65;
      margin-bottom: 16px;
    }

    .garantia-items {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .garantia-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .garantia-check {
      width: 22px; height: 22px;
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.3);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .garantia-check svg {
      width: 12px; height: 12px;
      stroke: #4ADE80; fill: none; stroke-width: 2.5;
    }

    /* ============================================================
       VIDEO SECTION
       ============================================================ */
    .video-section {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: var(--dark-700);
      border: 1px solid rgba(58,155,255,0.1);
    }

    .video-inner {
      aspect-ratio: 16/9;
    }

    .video-inner iframe,
    .video-inner video {
      width: 100%; height: 100%;
      border: none; display: block;
    }

    .video-play-btn {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(0,0,0,0.5);
      cursor: pointer;
      transition: background var(--transition);
    }

    .video-play-btn:hover { background: rgba(0,0,0,0.35); }

    .video-play-icon {
      width: 64px; height: 64px;
      background: rgba(240,165,0,0.9);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: transform var(--transition), box-shadow var(--transition);
      box-shadow: 0 0 0 0 rgba(240,165,0,0.4);
      animation: pulse-play 2.5s infinite;
    }

    @keyframes pulse-play {
      0%   { box-shadow: 0 0 0 0   rgba(240,165,0,0.5); }
      70%  { box-shadow: 0 0 0 16px rgba(240,165,0,0); }
      100% { box-shadow: 0 0 0 0   rgba(240,165,0,0); }
    }

    .video-play-icon svg { width: 26px; height: 26px; fill: #fff; margin-left: 3px; }

    .video-play-label {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ============================================================
       WHATSAPP CTA — grande, al pie
       ============================================================ */
    .wa-cta-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-wa-grande {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #128C7E 0%, #25D366 100%);
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.04em;
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
    }

    .btn-wa-grande::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent);
      opacity: 0;
      transition: opacity var(--transition);
    }

    .btn-wa-grande:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(37,211,102,0.4);
    }

    .btn-wa-grande:hover::after { opacity: 1; }
    .btn-wa-grande:active { transform: translateY(0); }
    .btn-wa-grande svg { width: 24px; height: 24px; fill: currentColor; flex-shrink: 0; }

    .wa-nota {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    /* ============================================================
       ID del motor — discreta
       ============================================================ */
    .motor-id-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--dark-700);
      border: 1px solid rgba(58,155,255,0.07);
      border-radius: 6px;
      padding: 3px 9px;
      width: fit-content;
    }

    /* ============================================================
       FULL-SCREEN IMAGE VIEWER
       ============================================================ */
    .img-viewer {
      position: fixed; inset: 0;
      z-index: 999;
      background: rgba(0,0,0,0.93);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .img-viewer.active {
      opacity: 1;
      pointer-events: all;
    }

    .img-viewer img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.8);
    }

    .img-viewer-close {
      position: absolute;
      top: 16px; right: 16px;
      width: 42px; height: 42px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 20px;
      transition: background var(--transition);
    }

    .img-viewer-close:hover { background: rgba(239,68,68,0.5); }

    /* ============================================================
       FOOTER
       ============================================================ */
    .site-footer {
      background: var(--dark-800);
      border-top: 1px solid rgba(58,155,255,0.08);
      padding: 32px clamp(16px, 4vw, 64px);
      text-align: center;
    }

    .footer-inner { max-width: 1200px; margin: 0 auto; }

    .footer-logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px; font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--white);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .footer-sub { font-size: 12px; color: var(--text-muted); }
    .footer-divider { margin: 20px 0; border: none; border-top: 1px solid rgba(58,155,255,0.07); }
    .footer-copy { font-size: 12px; color: var(--dark-400); }

    /* ============================================================
       SCROLLBAR
       ============================================================ */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--dark-900); }
    ::-webkit-scrollbar-thumb { background: var(--dark-500); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--metal-mid); }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 480px) {
      .specs-grid { grid-template-columns: 1fr 1fr; }
      .spec-card-value { font-size: 18px; }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       HEADER
       ============================================================ -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html">
        <!-- mismo logo que el catálogo — reemplazá src si cambia -->
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;letter-spacing:0.08em;color:#fff;text-transform:uppercase;">Desbalizar S.A.</span>
      </a>

      <a class="btn-back" href="index.html">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Volver al catálogo
      </a>
    </div>
  </header>

  <!-- ============================================================
       CONTENIDO PRINCIPAL (inyectado por JS)
       ============================================================ -->
  <main id="page-content">
    <div class="page-loading">
      <div class="spinner"></div>
      <div class="loading-text">Cargando motor…</div>
    </div>
  </main>

  <!-- ============================================================
       FULL-SCREEN IMAGE VIEWER
       ============================================================ -->
  <div class="img-viewer" id="img-viewer" onclick="cerrarViewer(event)">
    <button class="img-viewer-close" onclick="cerrarViewer()">✕</button>
    <img id="img-viewer-img" src="" alt="Foto ampliada" />
  </div>

  <!-- ============================================================
       FOOTER
       ============================================================ -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-logo">Desbalizar S.A.</div>
      <div class="footer-sub">Motores usados originales · Desarmadero automotor</div>
      <hr class="footer-divider" />
      <div class="footer-copy">© 2025 Desbalizar S.A. — Todos los derechos reservados</div>
    </div>
  </footer>

  <!-- ============================================================
       JAVASCRIPT
       ============================================================ -->
  <script>
    /* ------------------------------------------------------------------
       CONFIGURACIÓN SUPABASE — igual que index.html
    ------------------------------------------------------------------ */
    const SUPABASE_URL = "https://okjroggxyvwmlvowdldo.supabase.co";
    const SUPABASE_KEY = "sb_publishable_wMPA_yj45_gmi0duYi6CMw_vl0jNeE8";
    const WHATSAPP_NUM = "5491100000000"; // ← Reemplazá con el número real

    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    /* ------------------------------------------------------------------
       DESCRIPCIÓN GENERAL FIJA — igual para todos los motores
    ------------------------------------------------------------------ */
    const DESC_GENERAL = `Todos nuestros motores se entregan listos para incorporar y cuentan con su correspondiente documentación respaldatoria.`;

    const GARANTIA_ITEMS = [
      "Formulario 04D",
      "Certificado de baja",
      "Oblea RUDAC",
      "Garantía técnica de funcionamiento",
    ];

    /* ------------------------------------------------------------------
       CARRUSEL — estado
    ------------------------------------------------------------------ */
    let fotos       = [];
    let fotoActual  = 0;

    /* ------------------------------------------------------------------
       INICIALIZACIÓN
    ------------------------------------------------------------------ */
    document.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      const id     = params.get("id");

      if (!id) {
        mostrarError("No se especificó un motor.");
        return;
      }

      await cargarMotor(id);
    });

    /* ------------------------------------------------------------------
       CARGA DESDE SUPABASE
    ------------------------------------------------------------------ */
    async function cargarMotor(id) {
      try {
        const { data, error } = await sb
          .from("motores")
          .select("*")
          .eq("id", id)
          .single();

        if (error || !data) throw error || new Error("No encontrado");

        renderMotor(data);

      } catch (err) {
        console.error("Error:", err);
        mostrarError("No pudimos encontrar ese motor.");
      }
    }

    /* ------------------------------------------------------------------
       RENDERIZAR MOTOR
    ------------------------------------------------------------------ */
    function renderMotor(motor) {
      fotos       = Array.isArray(motor.fotos) ? motor.fotos : [];
      fotoActual  = 0;

      // Actualizar título de la pestaña
      document.title = `${motor.marca || ""} ${motor.modelo || ""} — Desbalizar S.A.`;

      const container = document.getElementById("page-content");
      container.innerHTML = "";

      /* ==== LAYOUT PRINCIPAL ==== */
      const main = document.createElement("div");
      main.className = "page-main";

      /* ---- COLUMNA IZQUIERDA: carrusel ---- */
      const carouselSection = document.createElement("div");
      carouselSection.className = "carousel-section";
      carouselSection.appendChild(crearCarrusel(motor));
      main.appendChild(carouselSection);

      /* ---- COLUMNA DERECHA: info ---- */
      const infoPanel = crearInfoPanel(motor);
      main.appendChild(infoPanel);

      container.appendChild(main);
    }

    /* ------------------------------------------------------------------
       CARRUSEL
    ------------------------------------------------------------------ */
    function crearCarrusel(motor) {
      const wrap = document.createElement("div");

      /* Imagen principal */
      const mainBox = document.createElement("div");
      mainBox.className = "carousel-main";

      if (fotos.length > 0) {
        // Imagen
        const img = document.createElement("img");
        img.id        = "carousel-img";
        img.className = "carousel-main-img";
        img.src       = fotos[0];
        img.alt       = `${motor.marca || ""} ${motor.modelo || ""}`;
        img.loading   = "eager";
        img.style.cursor = "zoom-in";
        img.onclick   = () => abrirViewer(fotos[fotoActual]);
        img.onerror   = () => img.replaceWith(placeholderCarrusel());
        mainBox.appendChild(img);

        // Flechas (solo si hay más de 1 foto)
        if (fotos.length > 1) {
          const btnPrev = document.createElement("button");
          btnPrev.className = "carousel-btn prev";
          btnPrev.id = "btn-prev";
          btnPrev.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>`;
          btnPrev.onclick = () => cambiarFoto(-1);
          mainBox.appendChild(btnPrev);

          const btnNext = document.createElement("button");
          btnNext.className = "carousel-btn next";
          btnNext.id = "btn-next";
          btnNext.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>`;
          btnNext.onclick = () => cambiarFoto(1);
          mainBox.appendChild(btnNext);

          // Contador
          const counter = document.createElement("div");
          counter.className = "carousel-counter";
          counter.id = "carousel-counter";
          counter.textContent = `1 / ${fotos.length}`;
          mainBox.appendChild(counter);

          actualizarNavegacion();
        }
      } else {
        mainBox.appendChild(placeholderCarrusel());
      }

      wrap.appendChild(mainBox);

      /* Thumbnails */
      if (fotos.length > 1) {
        const thumbsRow = document.createElement("div");
        thumbsRow.className = "carousel-thumbs";
        thumbsRow.id = "carousel-thumbs";

        fotos.forEach((url, idx) => {
          const thumb = document.createElement("img");
          thumb.className     = "carousel-thumb" + (idx === 0 ? " active" : "");
          thumb.src           = url;
          thumb.alt           = `Foto ${idx + 1}`;
          thumb.loading       = "lazy";
          thumb.dataset.index = idx;
          thumb.onerror       = () => thumb.remove();
          thumb.onclick       = () => irAFoto(idx);
          thumbsRow.appendChild(thumb);
        });

        wrap.appendChild(thumbsRow);
      }

      /* Video (debajo del carrusel, si existe) */
      if (motor.video) {
        const videoWrap = document.createElement("div");
        videoWrap.style.marginTop = "12px";
        videoWrap.appendChild(crearVideoSection(motor.video));
        wrap.appendChild(videoWrap);
      }

      return wrap;
    }

    function placeholderCarrusel() {
      const div = document.createElement("div");
      div.className = "carousel-placeholder";
      div.innerHTML = `
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <span>Sin imagen disponible</span>
      `;
      return div;
    }

    function cambiarFoto(dir) {
      fotoActual = (fotoActual + dir + fotos.length) % fotos.length;
      irAFoto(fotoActual);
    }

    function irAFoto(idx) {
      fotoActual = idx;
      const img = document.getElementById("carousel-img");
      if (img) {
        img.style.opacity = "0";
        setTimeout(() => {
          img.src = fotos[idx];
          img.style.opacity = "1";
        }, 180);
      }

      // Thumbnails activo
      const thumbs = document.querySelectorAll(".carousel-thumb");
      thumbs.forEach((t, i) => t.classList.toggle("active", i === idx));

      // Scroll thumbnail visible
      const activThumb = document.querySelector(".carousel-thumb.active");
      if (activThumb) activThumb.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });

      actualizarNavegacion();
    }

    function actualizarNavegacion() {
      const counter = document.getElementById("carousel-counter");
      if (counter) counter.textContent = `${fotoActual + 1} / ${fotos.length}`;

      const btnPrev = document.getElementById("btn-prev");
      const btnNext = document.getElementById("btn-next");
      // siempre visible (navegación circular)
      if (btnPrev) btnPrev.classList.remove("hidden");
      if (btnNext) btnNext.classList.remove("hidden");
    }

    // Teclado
    document.addEventListener("keydown", (e) => {
      if (document.getElementById("img-viewer").classList.contains("active")) return;
      if (e.key === "ArrowLeft")  cambiarFoto(-1);
      if (e.key === "ArrowRight") cambiarFoto(1);
    });

    /* ------------------------------------------------------------------
       VIDEO SECTION
    ------------------------------------------------------------------ */
    function crearVideoSection(videoUrl) {
      const section = document.createElement("div");
      section.className = "video-section";

      const ytMatch = videoUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([A-Za-z0-9_-]{11})/);

      if (ytMatch) {
        // YouTube: embed directo
        const inner = document.createElement("div");
        inner.className = "video-inner";
        const iframe = document.createElement("iframe");
        iframe.src = `https://www.youtube.com/embed/${ytMatch[1]}`;
        iframe.allow = "fullscreen";
        iframe.allowFullscreen = true;
        inner.appendChild(iframe);
        section.appendChild(inner);
      } else {
        // Video directo con botón play
        const playBtn = document.createElement("div");
        playBtn.className = "video-play-btn";
        playBtn.innerHTML = `
          <div class="video-play-icon">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
          <span class="video-play-label">Ver video del motor</span>
        `;
        playBtn.onclick = () => {
          const inner = document.createElement("div");
          inner.className = "video-inner";
          const video = document.createElement("video");
          video.src      = videoUrl;
          video.controls = true;
          video.autoplay = true;
          video.style.borderRadius = "14px";
          inner.appendChild(video);
          section.innerHTML = "";
          section.appendChild(inner);
        };
        section.appendChild(playBtn);
      }

      return section;
    }

    /* ------------------------------------------------------------------
       PANEL DE INFORMACIÓN
    ------------------------------------------------------------------ */
    function crearInfoPanel(motor) {
      const panel = document.createElement("div");
      panel.className = "info-panel";

      /* Breadcrumb */
      const bc = document.createElement("div");
      bc.className = "breadcrumb";
      bc.innerHTML = `<a href="index.html">Catálogo</a><span class="breadcrumb-sep">›</span><span>${esc(motor.marca) || "Motor"}</span>`;
      panel.appendChild(bc);

      /* Título */
      const titleWrap = document.createElement("div");
      titleWrap.innerHTML = `
        <div class="motor-brand">${esc(motor.marca) || "—"}</div>
        <div class="motor-model">${esc(motor.modelo) || "Motor"}</div>
      `;
      panel.appendChild(titleWrap);

      /* Badge disponible */
      const badge = document.createElement("div");
      badge.className = "badge-disponible";
      badge.textContent = "Disponible";
      panel.appendChild(badge);

      /* Specs */
      const specsGrid = document.createElement("div");
      specsGrid.className = "specs-grid";

      const specs = [
        { label: "Año",         value: motor.año         ? esc(motor.año)         : "—" },
        { label: "Kilómetros",  value: motor.km != null  ? formatKm(motor.km)     : "—" },
        { label: "Cilindrada",  value: motor.cilindrada  ? esc(motor.cilindrada)  : "—" },
        { label: "ID Interno",  value: motor.id          ? `#${esc(motor.id)}`    : "—" },
      ];

      specs.forEach(s => {
        const card = document.createElement("div");
        card.className = "spec-card";
        card.innerHTML = `
          <div class="spec-card-label">${s.label}</div>
          <div class="spec-card-value">${s.value}</div>
        `;
        specsGrid.appendChild(card);
      });

      panel.appendChild(specsGrid);

      /* Descripción específica del motor (si existe) */
      if (motor.descripcion) {
        const descBlock = document.createElement("div");
        descBlock.className = "section-block";
        descBlock.innerHTML = `
          <div class="section-block-title">Descripción</div>
          <p class="motor-descripcion">${esc(motor.descripcion)}</p>
        `;
        panel.appendChild(descBlock);
      }

      /* Descripción general + garantía fija */
      const garantiaBlock = document.createElement("div");
      garantiaBlock.className = "garantia-block";
      garantiaBlock.innerHTML = `
        <div class="section-block-title">Documentación y garantía</div>
        <p class="garantia-intro">${DESC_GENERAL}</p>
        <div class="garantia-items">
          ${GARANTIA_ITEMS.map(item => `
            <div class="garantia-item">
              <div class="garantia-check">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
              ${esc(item)}
            </div>
          `).join("")}
        </div>
      `;
      panel.appendChild(garantiaBlock);

      /* WhatsApp CTA */
      const waCta = document.createElement("div");
      waCta.className = "wa-cta-block";

      const waBtn = document.createElement("a");
      waBtn.className = "btn-wa-grande";
      waBtn.href      = generarLinkWA(motor);
      waBtn.target    = "_blank";
      waBtn.rel       = "noopener noreferrer";
      waBtn.innerHTML = `
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.521.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.521-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
          <path d="M12.004 2C6.477 2 2 6.477 2 12c0 1.886.516 3.65 1.414 5.169L2 22l4.986-1.396A9.936 9.936 0 0 0 12.004 22C17.523 22 22 17.523 22 12S17.523 2 12.004 2zm0 18.19c-1.702 0-3.284-.47-4.63-1.282l-.332-.197-3.044.851.805-3.123-.214-.341a8.18 8.18 0 0 1-1.242-4.32c0-4.518 3.674-8.192 8.19-8.192 4.517 0 8.191 3.674 8.191 8.191 0 4.518-3.674 8.193-8.191 8.193h-.533z"/>
        </svg>
        Consultar por WhatsApp
      `;
      waCta.appendChild(waBtn);

      const waNota = document.createElement("p");
      waNota.className = "wa-nota";
      waNota.textContent = "Respondemos a la brevedad · Lunes a sábado";
      waCta.appendChild(waNota);

      panel.appendChild(waCta);

      return panel;
    }

    /* ------------------------------------------------------------------
       FULL-SCREEN VIEWER
    ------------------------------------------------------------------ */
    function abrirViewer(src) {
      const viewer = document.getElementById("img-viewer");
      const img    = document.getElementById("img-viewer-img");
      img.src = src;
      viewer.classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function cerrarViewer(e) {
      if (e && e.target !== document.getElementById("img-viewer") && !e.currentTarget.classList.contains("img-viewer-close")) return;
      document.getElementById("img-viewer").classList.remove("active");
      document.body.style.overflow = "";
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        document.getElementById("img-viewer").classList.remove("active");
        document.body.style.overflow = "";
      }
    });

    /* ------------------------------------------------------------------
       ERROR STATE
    ------------------------------------------------------------------ */
    function mostrarError(msg) {
      document.getElementById("page-content").innerHTML = `
        <div class="page-loading">
          <div style="text-align:center;padding:48px 24px;max-width:420px;margin:0 auto">
            <div style="font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;color:#F87171;margin-bottom:12px">Motor no encontrado</div>
            <p style="font-size:14px;color:var(--text-muted);margin-bottom:24px">${esc(msg || "Verificá el enlace o volvé al catálogo.")}</p>
            <a href="index.html" class="btn-back" style="display:inline-flex;margin:0 auto">
              ← Volver al catálogo
            </a>
          </div>
        </div>
      `;
    }

    /* ------------------------------------------------------------------
       UTILIDADES
    ------------------------------------------------------------------ */
    function esc(str) {
      if (str == null) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatKm(km) {
      if (km == null || km === "" || km === false) return "—";
      const n = Number(km);
      if (isNaN(n)) return "—";
      return Number(km).toLocaleString("es-AR") + " km";
    }

    function generarLinkWA(motor) {
      const marca      = motor.marca     || "desconocida";
      const modelo     = motor.modelo    || "desconocido";
      const anio       = motor.año       ? ` (${motor.año})` : "";
      const cilindrada = motor.cilindrada ? `, ${motor.cilindrada}` : "";
      const id         = motor.id        ? ` — ID #${motor.id}` : "";
      const msg = `Hola! Estoy interesado/a en el motor *${marca} ${modelo}*${anio}${cilindrada}${id} que vi en su catálogo online. ¿Podría darme más información?`;
      return `https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(msg)}`;
    }
  </script>
