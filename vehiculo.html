<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vehículo — Desbalizar S.A.</title>
  <meta name="description" content="Vehículo ingresado en Desbalizar S.A., desarmadero en Bolívar, Buenos Aires."/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --accent:      #3A9BFF;
      --accent-warm: #F0A500;
      --dark-900:    #0A0D14;
      --dark-800:    #10141F;
      --dark-700:    #161C2E;
      --dark-600:    #1F2840;
      --text-1:      #EDF2FF;
      --text-2:      #9BADC8;
      --text-3:      #5E7299;
      --white:       #FFFFFF;
      --success:     #22C55E;
      --tr:          0.3s cubic-bezier(.4,0,.2,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: var(--dark-900); color: var(--text-1); min-height: 100vh; }
    a { text-decoration: none; color: inherit; }
    img { display: block; max-width: 100%; }

    /* NAV */
    .site-nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,13,20,0.95); backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(58,155,255,0.1);
      padding: 0 clamp(16px,4vw,64px);
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto;
      height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; }
    .nav-logo img { height: 40px; width: auto; }
    .nav-logo-name { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--white); }
    .nav-logo-sub { font-size: 10px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
    .btn-back {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 8px;
      font-size: 13px; font-weight: 600; color: var(--text-2);
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      transition: all var(--tr);
    }
    .btn-back:hover { color: var(--white); background: rgba(255,255,255,0.08); }
    .btn-back svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* LAYOUT PRINCIPAL */
    .page-wrap { max-width: 1200px; margin: 0 auto; padding: 32px clamp(16px,4vw,48px) 100px; }

    .vehicle-layout {
      display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start;
    }
    @media (max-width: 768px) { .vehicle-layout { grid-template-columns: 1fr; gap: 24px; } }

    /* CARRUSEL */
    .gallery-wrap { position: relative; }

    .main-photo {
      width: 100%; aspect-ratio: 4/3; border-radius: 16px; overflow: hidden;
      background: var(--dark-800); position: relative;
    }
    .main-photo img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: opacity .3s ease;
    }
    .photo-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      display: flex; justify-content: space-between; width: 100%; padding: 0 12px;
      pointer-events: none;
    }
    .photo-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; pointer-events: all; transition: all var(--tr);
      color: var(--white);
    }
    .photo-btn:hover { background: rgba(0,0,0,0.8); }
    .photo-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; }

    .photo-counter {
      position: absolute; bottom: 12px; right: 12px;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 6px;
      padding: 3px 10px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.85);
    }

    .thumbnails {
      display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;
    }
    .thumb {
      width: 64px; height: 64px; border-radius: 8px; overflow: hidden;
      cursor: pointer; border: 2px solid transparent; transition: all var(--tr);
      flex-shrink: 0;
    }
    .thumb.active { border-color: var(--accent-warm); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }

    /* PANEL INFO */
    .info-panel { display: flex; flex-direction: column; gap: 20px; }

    .veh-kicker {
      font-size: 11px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase;
      color: var(--accent-warm);
    }
    .veh-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(32px,4vw,52px); font-weight: 800;
      text-transform: uppercase; color: var(--white);
      line-height: .95; letter-spacing: .01em;
    }

    .specs-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .spec-item {
      background: var(--dark-800); border: 1px solid rgba(58,155,255,0.08);
      border-radius: 10px; padding: 12px 16px;
    }
    .spec-label {
      font-size: 10px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--text-3); margin-bottom: 4px;
    }
    .spec-value {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px; font-weight: 700; color: var(--white); line-height: 1;
    }

    .obs-block {
      background: var(--dark-800); border: 1px solid rgba(58,155,255,0.08);
      border-radius: 10px; padding: 16px;
    }
    .obs-label { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; }
    .obs-text { font-size: 14px; color: var(--text-2); line-height: 1.7; }

    /* WA BUTTON */
    .wa-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 16px; border-radius: 12px;
      background: var(--success); color: #fff;
      font-size: 16px; font-weight: 700;
      transition: all var(--tr); text-decoration: none;
      box-shadow: 0 4px 20px rgba(34,197,94,0.3);
    }
    .wa-btn:hover { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(34,197,94,0.45); }
    .wa-btn svg { width: 22px; height: 22px; fill: currentColor; flex-shrink: 0; }

    .rudac-badge {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; border-radius: 8px;
      background: rgba(58,155,255,0.05); border: 1px solid rgba(58,155,255,0.15);
      font-size: 12px; color: var(--text-2);
    }
    .rudac-badge strong { color: var(--white); }

    /* LOADING / ERROR */
    .state-wrap { text-align: center; padding: 80px 24px; }
    .spinner { width: 40px; height: 40px; border-radius: 50%; border: 3px solid rgba(58,155,255,0.15); border-top-color: var(--accent); animation: spin .8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-title { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 700; color: var(--text-2); margin-bottom: 8px; }
    .state-sub { font-size: 14px; color: var(--text-3); }

    /* WA STICKY MOBILE */
    .wa-sticky {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      padding: 12px 20px 16px;
      background: linear-gradient(to top, rgba(10,13,20,1) 60%, transparent);
      display: none;
    }
    @media (max-width: 768px) { .wa-sticky { display: block; } }
    .wa-sticky a {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px; border-radius: 14px;
      background: var(--success); color: #fff;
      font-size: 15px; font-weight: 700;
      box-shadow: 0 8px 24px rgba(34,197,94,0.45); text-decoration: none;
    }
    .wa-sticky a svg { width: 20px; height: 20px; fill: currentColor; }
  </style>
</head>
<body>

  <nav class="site-nav">
    <div class="nav-inner">
      <a class="nav-logo" href="/">
        <img src="https://okjroggxyvwmlvowdldo.supabase.co/storage/v1/object/public/assets/balizar%20fondo.jpg" alt="Desbalizar"/>
        <div>
          <div class="nav-logo-name">Desbalizar S.A.</div>
          <div class="nav-logo-sub">Desarmadero · Bolívar</div>
        </div>
      </a>
      <a class="btn-back" href="/vehiculos">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Volver al catálogo
      </a>
    </div>
  </nav>

  <div class="page-wrap" id="page-wrap">
    <div class="state-wrap" id="loading">
      <div class="spinner"></div>
      <div class="state-title">Cargando vehículo…</div>
    </div>
  </div>

  <div class="wa-sticky" id="wa-sticky" style="display:none">
    <a id="wa-sticky-link" href="#" target="_blank">
      <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.521.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.521-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.096.541 4.063 1.487 5.776L.057 23.428a.5.5 0 0 0 .609.61l5.724-1.43A11.946 11.946 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.891 0-3.667-.524-5.183-1.432l-.371-.22-3.849.962.979-3.773-.242-.386A9.961 9.961 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
      Consultar disponibilidad
    </a>
  </div>

  <script>
    const SUPABASE_URL = "https://okjroggxyvwmlvowdldo.supabase.co";
    const SUPABASE_KEY = "sb_publishable_wMPA_yj45_gmi0duYi6CMw_vl0jNeE8";
    const WA_NUM = "542314545224";
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    function esc(s) { return s == null ? "" : String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    function formatKm(n) { const num = Number(n); return isNaN(num) || n == null ? null : num.toLocaleString("es-AR") + " km"; }

    const params = new URLSearchParams(location.search);
    const id = params.get("id");

    async function cargar() {
      if (!id) { mostrarError("ID de vehículo no encontrado."); return; }
      try {
        const { data, error } = await sb.from("vehiculos").select("*").eq("id", id).single();
        if (error || !data) throw error || new Error("No encontrado");
        renderizar(data);
      } catch(e) {
        mostrarError("No se pudo cargar el vehículo.");
      }
    }

    function mostrarError(msg) {
      document.getElementById("page-wrap").innerHTML = `
        <div class="state-wrap">
          <div class="state-title" style="color:#F87171">Error</div>
          <div class="state-sub">${esc(msg)}</div>
          <a href="/vehiculos" style="display:inline-block;margin-top:20px;color:var(--accent);font-size:14px">← Volver al catálogo</a>
        </div>`;
    }

    let fotoActual = 0;
    let fotosArr = [];

    function renderizar(v) {
      fotosArr = Array.isArray(v.fotos) ? v.fotos.filter(Boolean) : [];
      const km = formatKm(v.km);
      const waMsg = `Hola, vi el ${v.marca || ""} ${v.modelo || ""}${v.anio ? " " + v.anio : ""} en el catálogo de Desbalizar. ¿Qué piezas tienen disponibles?`;
      const waUrl = `https://wa.me/${WA_NUM}?text=${encodeURIComponent(waMsg)}`;

      // Título de la pestaña y meta
      document.title = `${v.marca || ""} ${v.modelo || ""} — Desbalizar S.A.`;

      const wrap = document.getElementById("page-wrap");
      wrap.innerHTML = `
        <div class="vehicle-layout">

          <!-- GALERÍA -->
          <div class="gallery-wrap">
            <div class="main-photo" id="main-photo">
              ${fotosArr.length > 0
                ? `<img id="main-img" src="${esc(fotosArr[0])}" alt="${esc(v.marca)} ${esc(v.modelo)}"/>`
                : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--dark-700)"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(100,120,160,0.4)" stroke-width="1.5"><path d="M5 17H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v3"/><rect x="9" y="11" width="14" height="10" rx="1"/></svg></div>`
              }
              ${fotosArr.length > 1 ? `
              <div class="photo-nav">
                <button class="photo-btn" onclick="cambiarFoto(-1)"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
                <button class="photo-btn" onclick="cambiarFoto(1)"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
              </div>
              <div class="photo-counter" id="photo-counter">1 / ${fotosArr.length}</div>
              ` : ""}
            </div>
            ${fotosArr.length > 1 ? `
            <div class="thumbnails" id="thumbnails">
              ${fotosArr.map((f,i) => `
                <div class="thumb${i===0?" active":""}" onclick="irAFoto(${i})">
                  <img src="${esc(f)}" alt="Foto ${i+1}" loading="lazy"/>
                </div>`).join("")}
            </div>` : ""}
          </div>

          <!-- INFO -->
          <div class="info-panel">
            <div>
              <div class="veh-kicker">Vehículo ingresado · Desbalizar S.A.</div>
              <div class="veh-title">${esc(v.marca) || ""}<br/>${esc(v.modelo) || "Vehículo"}</div>
            </div>

            <div class="specs-grid">
              ${v.anio ? `<div class="spec-item"><div class="spec-label">Año</div><div class="spec-value">${esc(v.anio)}</div></div>` : ""}
              ${km ? `<div class="spec-item"><div class="spec-label">Kilometraje</div><div class="spec-value">${km}</div></div>` : ""}
            </div>

            ${v.observaciones ? `
            <div class="obs-block">
              <div class="obs-label">Observaciones</div>
              <div class="obs-text">${esc(v.observaciones)}</div>
            </div>` : ""}

            <a class="wa-btn" href="${waUrl}" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.521.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.521-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.096.541 4.063 1.487 5.776L.057 23.428a.5.5 0 0 0 .609.61l5.724-1.43A11.946 11.946 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.891 0-3.667-.524-5.183-1.432l-.371-.22-3.849.962.979-3.773-.242-.386A9.961 9.961 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
              Consultar disponibilidad por WhatsApp
            </a>

            <div class="rudac-badge">
              ✅ <strong>Desarmadero avalado por el RUDAC</strong> — documentación respaldatoria en todas las piezas
            </div>
          </div>

        </div>`;

      // WA sticky mobile
      const sticky = document.getElementById("wa-sticky");
      const stickyLink = document.getElementById("wa-sticky-link");
      stickyLink.href = waUrl;
      sticky.style.display = "block";
    }

    function cambiarFoto(dir) {
      fotoActual = (fotoActual + dir + fotosArr.length) % fotosArr.length;
      irAFoto(fotoActual);
    }

    function irAFoto(i) {
      fotoActual = i;
      const img = document.getElementById("main-img");
      const counter = document.getElementById("photo-counter");
      const thumbs = document.querySelectorAll(".thumb");
      if (img) img.src = fotosArr[i];
      if (counter) counter.textContent = `${i + 1} / ${fotosArr.length}`;
      thumbs.forEach((t, idx) => t.classList.toggle("active", idx === i));
    }

    cargar();
  </script>
</body>
</html>
