<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Generar Story — Desbalizar</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #060A10; color: #EDF2FF; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 28px 16px 80px; }
    .top-bar { width: 100%; max-width: 480px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .top-bar a { font-size: 13px; color: #3A9BFF; text-decoration: none; display: flex; align-items: center; gap: 5px; }
    .top-bar a svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
    .top-title { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; text-transform: uppercase; color: #fff; }

    .controls { width: 100%; max-width: 480px; background: #0D1420; border: 1px solid rgba(58,155,255,0.1); border-radius: 16px; padding: 18px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 14px; }
    .ctrl-label { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #4A6080; margin-bottom: 5px; }
    .ctrl-veh { font-size: 16px; font-weight: 600; color: #fff; }
    .ctrl-datos { font-size: 13px; color: #8A9CB8; margin-top: 2px; }

    .fotos-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .foto-slot { background: #111926; border: 1.5px solid rgba(255,255,255,0.06); border-radius: 10px; aspect-ratio: 4/3; overflow: hidden; position: relative; cursor: pointer; transition: border-color .2s; }
    .foto-slot:hover { border-color: rgba(58,155,255,0.4); }
    .foto-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .foto-slot-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-align: center; padding: 4px; color: rgba(255,255,255,0.7); font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; }
    .foto-slot-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 5px; color: #3A5070; font-size: 11px; }
    .foto-slot-empty svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; }
    .hint { font-size: 12px; color: #3A5070; text-align: center; }

    .btn-download { width: 100%; max-width: 480px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 15px; border-radius: 12px; background: linear-gradient(135deg, #0C3C6E, #1554A8, #2E85E8); color: #fff; font-size: 16px; font-weight: 600; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: filter .2s; margin-bottom: 28px; box-shadow: 0 8px 28px rgba(21,84,168,0.35); letter-spacing: 0.02em; }
    .btn-download:hover { filter: brightness(1.12); }
    .btn-download:disabled { opacity: .45; cursor: not-allowed; }

    .preview-wrap { width: 100%; max-width: 320px; border-radius: 14px; overflow: hidden; border: 1px solid rgba(58,155,255,0.15); box-shadow: 0 24px 64px rgba(0,0,0,0.8); }
    .preview-wrap canvas { width: 100%; display: block; }
    #loading { text-align: center; color: #3A5070; font-size: 13px; padding: 40px; background: #0D1420; }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="/admin">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Volver al admin
    </a>
    <div class="top-title">📱 Story</div>
  </div>

  <div class="controls">
    <div>
      <div class="ctrl-label">Vehículo</div>
      <div class="ctrl-veh" id="ctrl-nombre">Cargando…</div>
      <div class="ctrl-datos" id="ctrl-datos"></div>
    </div>
    <div>
      <div class="ctrl-label">Fotos — tocá para intercambiar</div>
      <div class="fotos-row">
        <div class="foto-slot" id="slot-a" onclick="swap()">
          <div class="foto-slot-empty" id="slot-a-empty">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            Sin foto
          </div>
          <div class="foto-slot-label">Arriba</div>
        </div>
        <div class="foto-slot" id="slot-b" onclick="swap()">
          <div class="foto-slot-empty" id="slot-b-empty">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            Sin foto
          </div>
          <div class="foto-slot-label">Abajo</div>
        </div>
      </div>
      <div class="hint">Tocá para intercambiar · Preview en tiempo real</div>
    </div>
  </div>

  <button class="btn-download" id="btn-dl" onclick="descargar()">
    ⬇ Descargar Story 1080×1920
  </button>

  <div class="preview-wrap">
    <div id="loading">Cargando…</div>
    <canvas id="cv" style="display:none"></canvas>
  </div>

  <script>
    const SB_URL = "https://okjroggxyvwmlvowdldo.supabase.co";
    const SB_KEY = "sb_publishable_wMPA_yj45_gmi0duYi6CMw_vl0jNeE8";
    const { createClient } = supabase;
    const sb = createClient(SB_URL, SB_KEY);

    const W = 1080, H = 1920;
    let V = null, fotos = [null, null];

    async function loadFonts() {
      const pairs = [
        ["https://fonts.gstatic.com/s/barlowcondensed/v12/HTxwL3I-JCGChYJ8VI-L6OO_au7B43LSmQ.woff2", "900"],
        ["https://fonts.gstatic.com/s/barlowcondensed/v12/HTxxL3I-JCGChYJ8VI-L6OO_au7B4973mhdSqmM.woff2", "700"],
        ["https://fonts.gstatic.com/s/barlowcondensed/v12/HTxxL3I-JCGChYJ8VI-L6OO_au7B46Z1mhdSqmM.woff2", "500"],
      ];
      await Promise.all(pairs.map(([url, w]) => {
        const f = new FontFace("BC", `url(${url})`, { weight: w });
        return f.load().then(loaded => document.fonts.add(loaded)).catch(() => {});
      }));
      await document.fonts.ready;
    }

    async function loadImg(url) {
      if (!url) return null;
      return new Promise(res => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => res(img);
        img.onerror = () => {
          const img2 = new Image();
          img2.onload = () => res(img2);
          img2.onerror = () => res(null);
          img2.src = url;
        };
        img.src = url;
      });
    }

    function cover(ctx, img, x, y, w, h) {
      if (!img) {
        ctx.fillStyle = "#08111E";
        ctx.fillRect(x, y, w, h);
        return;
      }
      const s = Math.max(w / img.width, h / img.height);
      const sw = img.width * s, sh = img.height * s;
      ctx.save();
      ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
      ctx.drawImage(img, x + (w - sw) / 2, y + (h - sh) / 2, sw, sh);
      ctx.restore();
    }

    function gradV(ctx, x, y, w, h, stops) {
      const g = ctx.createLinearGradient(0, y, 0, y + h);
      stops.forEach(([pos, color]) => g.addColorStop(pos, color));
      ctx.fillStyle = g;
      ctx.fillRect(x, y, w, h);
    }

    function roundRect(ctx, x, y, w, h, r, fill, stroke, lw) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
      ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
      ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
      ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1.5; ctx.stroke(); }
    }

    async function render(canvas) {
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext("2d");
      const v = V;
      const BG = "#060A10";
      const cx = W / 2;
      const FONT = "BC, 'Arial Black', Arial";

      // ── ZONAS (píxeles absolutos en 1080×1920)
      // Foto arriba:  0 → 950px  (49%)
      // Info central: 950 → 1460px (27%)
      // Foto abajo:   1460 → 1920px (24%)
      const TOP_END  = 950;
      const BOT_START = 1460;
      const BOT_H    = H - BOT_START;  // 460px
      const INFO_H   = BOT_START - TOP_END; // 510px — espacio cómodo

      // ── Fondo base
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, W, H);

      const [imgA, imgB] = await Promise.all([loadImg(fotos[0]), loadImg(fotos[1])]);

      // ── Foto arriba
      cover(ctx, imgA, 0, 0, W, TOP_END);

      // Fade inferior foto arriba — largo y suave
      gradV(ctx, 0, TOP_END - 380, W, 380, [
        [0,   "rgba(6,10,16,0)"],
        [0.6, "rgba(6,10,16,0.8)"],
        [1,   "rgba(6,10,16,1)"]
      ]);

      // ── Bloque info — fondo sólido
      ctx.fillStyle = BG;
      ctx.fillRect(0, TOP_END, W, INFO_H);

      // ── Foto abajo
      cover(ctx, imgB, 0, BOT_START, W, BOT_H);

      // Fade superior foto abajo
      gradV(ctx, 0, BOT_START, W, Math.round(BOT_H * 0.55), [
        [0, "rgba(6,10,16,1)"],
        [1, "rgba(6,10,16,0)"]
      ]);

      // Fade inferior foto abajo (firma)
      gradV(ctx, 0, H - 180, W, 180, [
        [0, "rgba(6,10,16,0)"],
        [1, "rgba(6,10,16,0.88)"]
      ]);

      // ── LOGO — esquina superior izquierda ──
      const logoImg = await loadImg("https://okjroggxyvwmlvowdldo.supabase.co/storage/v1/object/public/assets/balizar%20fondo.jpg");
      const LX = 60, LY = 68, LR = 40;
      if (logoImg) {
        ctx.save();
        ctx.beginPath(); ctx.arc(LX, LY, LR, 0, Math.PI * 2); ctx.clip();
        ctx.drawImage(logoImg, LX - LR, LY - LR, LR * 2, LR * 2);
        ctx.restore();
        ctx.beginPath(); ctx.arc(LX, LY, LR + 2.5, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(58,155,255,0.28)"; ctx.lineWidth = 2.5; ctx.stroke();
      }

      // Texto logo
      ctx.textAlign = "left";
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.font = `700 30px ${FONT}`;
      ctx.fillText("DESBALIZAR", LX + LR + 16, LY - 4);
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.font = `400 22px 'DM Sans', Arial`;
      ctx.fillText("Desarmadero autorizado", LX + LR + 16, LY + 22);

      // ── BLOQUE INFO — posicionado dentro de INFO_H ──
      ctx.textAlign = "center";

      // Punto de inicio del bloque de texto (dentro de la zona info)
      const IY = TOP_END + 60; // 60px de margen superior dentro del bloque

      // Badge pill
      const badgeTxt = "INGRESO PARA DESARME";
      ctx.font = `600 32px ${FONT}`;
      const bW = ctx.measureText(badgeTxt).width + 64;
      const bH = 58;
      const bX = cx - bW / 2;
      const bY = IY;
      roundRect(ctx, bX, bY, bW, bH, bH / 2,
        "rgba(21,84,168,0.16)",
        "rgba(58,155,255,0.25)", 1.5);
      ctx.fillStyle = "#3A9BFF";
      ctx.beginPath(); ctx.arc(bX + 28, bY + bH / 2, 5.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#7AAEDE";
      ctx.font = `600 30px ${FONT}`;
      ctx.letterSpacing = "3px";
      ctx.fillText(badgeTxt, cx + 7, bY + bH / 2 + 11);
      ctx.letterSpacing = "0px";

      // Marca
      const marcaY = bY + bH + 80;
      ctx.fillStyle = "rgba(255,255,255,0.28)";
      ctx.font = `500 44px ${FONT}`;
      ctx.letterSpacing = "10px";
      ctx.fillText((v.marca || "").toUpperCase(), cx, marcaY);
      ctx.letterSpacing = "0px";

      // Modelo — protagonista, tamaño adaptativo
      const modelo = (v.modelo || "").toUpperCase();
      let fs = 152;
      ctx.font = `900 ${fs}px ${FONT}`;
      while (ctx.measureText(modelo).width > W - 64 && fs > 72) {
        fs -= 4;
        ctx.font = `900 ${fs}px ${FONT}`;
      }
      const modeloY = marcaY + fs * 0.92;
      ctx.fillStyle = "#FFFFFF";
      ctx.fillText(modelo, cx, modeloY);

      // Specs — año · km
      const specs = [];
      if (v.anio) specs.push(String(v.anio));
      if (v.km) specs.push(Number(v.km).toLocaleString("es-AR") + " km");
      if (specs.length) {
        ctx.fillStyle = "rgba(255,255,255,0.3)";
        ctx.font = `400 36px 'DM Sans', Arial`;
        ctx.letterSpacing = "2px";
        ctx.fillText(specs.join("   ·   "), cx, modeloY + 68);
        ctx.letterSpacing = "0px";
      }

      // ── FIRMA inferior ──
      ctx.fillStyle = "rgba(255,255,255,0.14)";
      ctx.font = `300 24px 'DM Sans', Arial`;
      ctx.letterSpacing = "4px";
      ctx.fillText("DESBALIZAR S.A.  ·  BOLÍVAR, BUENOS AIRES", cx, H - 38);
      ctx.letterSpacing = "0px";
    }

    async function actualizarPreview() {
      const cv = document.getElementById("cv");
      const ld = document.getElementById("loading");
      ld.style.display = "block"; cv.style.display = "none";
      await render(cv);
      ld.style.display = "none"; cv.style.display = "block";
    }

    function swap() {
      [fotos[0], fotos[1]] = [fotos[1], fotos[0]];
      actualizarSlots();
      actualizarPreview();
    }

    function actualizarSlots() {
      [["a", 0], ["b", 1]].forEach(([s, i]) => {
        const slot = document.getElementById(`slot-${s}`);
        const empty = document.getElementById(`slot-${s}-empty`);
        const url = fotos[i];
        const old = slot.querySelector("img");
        if (url) {
          empty.style.display = "none";
          if (old) { old.src = url; } else {
            const img = document.createElement("img");
            img.src = url;
            slot.insertBefore(img, slot.querySelector(".foto-slot-label"));
          }
        } else {
          empty.style.display = "flex";
          if (old) old.remove();
        }
      });
    }

    async function descargar() {
      const btn = document.getElementById("btn-dl");
      btn.disabled = true; btn.textContent = "Generando…";
      const cv = document.createElement("canvas");
      await render(cv);
      const nombre = `story_${(V.marca||"").toLowerCase()}_${(V.modelo||"").toLowerCase().replace(/\s+/g,"_")}.jpg`;
      cv.toBlob(blob => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = nombre; a.click();
        URL.revokeObjectURL(a.href);
        btn.disabled = false;
        btn.textContent = "⬇ Descargar Story 1080×1920";
      }, "image/jpeg", 0.95);
    }

    async function init() {
      await loadFonts();
      const id = new URLSearchParams(location.search).get("id");
      if (!id) return;
      const { data } = await sb.from("vehiculos").select("*").eq("id", id).single();
      if (!data) return;
      V = data;
      fotos = Array.isArray(data.fotos) ? [data.fotos[0]||null, data.fotos[1]||null] : [null, null];
      document.getElementById("ctrl-nombre").textContent = `${data.marca||""} ${data.modelo||""}`.trim();
      const d = [data.anio, data.km ? Number(data.km).toLocaleString("es-AR") + " km" : null].filter(Boolean).join(" · ");
      document.getElementById("ctrl-datos").textContent = d;
      actualizarSlots();
      await actualizarPreview();
    }

    init();
  </script>
</body>
</html>
