<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Desbalizar S.A. — Links</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-dark:  #0a1628;
      --blue-mid:   #0d3a6e;
      --blue-light: #1a6bb5;
      --blue-pale:  #5ab0e0;
      --white:      #ffffff;
      --gray:       rgba(255,255,255,0.12);
      --gray-hover: rgba(255,255,255,0.2);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      background: var(--blue-dark);
      padding: 32px 0;
    }

    /* Fondo animado */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(90,176,224,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 90%, rgba(26,107,181,0.25) 0%, transparent 60%),
        radial-gradient(ellipse 100% 100% at 50% 50%, #0d3a6e 0%, #0a1628 100%);
      z-index: 0;
      animation: shift 8s ease-in-out infinite alternate;
    }

    @keyframes shift {
      from { opacity: 1; }
      to   { opacity: 0.7; }
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(400px, 92vw);
      padding: 40px 28px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* Logo */
    .logo-wrap {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
      box-shadow: 0 0 0 4px rgba(90,176,224,0.3), 0 8px 32px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .nombre {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 3px;
      color: var(--white);
      text-align: center;
      line-height: 1;
    }

    .subtitulo {
      font-size: 13px;
      color: var(--blue-pale);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
      margin-top: -6px;
      margin-bottom: 8px;
    }

    /* Botones */
    .btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.15);
      background: var(--gray);
      color: var(--white);
      text-decoration: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      animation: fadeUp 0.5s ease both;
    }

    .btn:nth-child(1) { animation-delay: 0.1s; }
    .btn:nth-child(2) { animation-delay: 0.2s; }
    .btn:nth-child(3) { animation-delay: 0.3s; }
    .btn:nth-child(4) { animation-delay: 0.4s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .btn:hover {
      background: var(--gray-hover);
      border-color: rgba(255,255,255,0.35);
      transform: translateY(-2px);
    }

    .btn:active { transform: translateY(0); }

    .btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 22px;
    }

    .btn-icon.maps    { background: rgba(234,67,53,0.25); }
    .btn-icon.whatsapp{ background: rgba(37,211,102,0.25); }
    .btn-icon.catalogo{ background: rgba(26,107,181,0.35); }

    .btn-text { flex: 1; }
    .btn-label { display: block; font-size: 15px; font-weight: 600; }
    .btn-sub   { display: block; font-size: 12px; font-weight: 400; opacity: 0.6; margin-top: 1px; }

    .btn-arrow { opacity: 0.5; font-size: 18px; }

    /* Footer */
    .footer {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      text-align: center;
      margin-top: 8px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="logo-wrap">
      <img src="https://okjroggxyvwmlvowdldo.supabase.co/storage/v1/object/public/assets/balizar%20fondo.jpg" alt="Desbalizar"/>
    </div>

    <div class="nombre">DESBALIZAR</div>
    <div class="subtitulo">S.A. Ventas de Autopartes · Bolívar, BA</div>

    <!-- Ubicación -->
    <a class="btn" href="https://maps.app.goo.gl/2Czrgtm4fWtjnbb18" target="_blank">
      <div class="btn-icon maps">📍</div>
      <div class="btn-text">
        <span class="btn-label">Cómo llegar</span>
        <span class="btn-sub">Santiago del Estero 910, Bolívar</span>
      </div>
      <span class="btn-arrow">›</span>
    </a>

    <!-- WhatsApp -->
    <a class="btn" href="https://wa.me/542314545224" target="_blank">
      <div class="btn-icon whatsapp">💬</div>
      <div class="btn-text">
        <span class="btn-label">Escribinos por WhatsApp</span>
        <span class="btn-sub">2314545224 — respuesta rápida</span>
      </div>
      <span class="btn-arrow">›</span>
    </a>

    <!-- Sitio web -->
    <a class="btn" href="https://desbalizar.vercel.app" target="_blank">
      <div class="btn-icon catalogo">🌐</div>
      <div class="btn-text">
        <span class="btn-label">Nuestro sitio web</span>
        <span class="btn-sub">Motores, vehículos y más</span>
      </div>
      <span class="btn-arrow">›</span>
    </a>

    <div class="footer">Desbalizar S.A. · Bolívar, Buenos Aires</div>
  </div>
</body>
</html>
