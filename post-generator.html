<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Generar Publicación — Desbalizar</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #060A10; color: #EDF2FF; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 28px 16px 80px; }
    .top-bar { width: 100%; max-width: 480px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .top-bar a { font-size: 13px; color: #3A9BFF; text-decoration: none; display: flex; align-items: center; gap: 5px; }
    .top-bar a svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
    .top-title { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; text-transform: uppercase; color: #fff; }
    .controls { width: 100%; max-width: 480px; background: #0D1420; border: 1px solid rgba(58,155,255,0.1); border-radius: 16px; padding: 18px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 14px; }
    .ctrl-label { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #4A6080; margin-bottom: 5px; }
    .ctrl-veh { font-size: 16px; font-weight: 600; color: #fff; }
    .ctrl-datos { font-size: 13px; color: #8A9CB8; margin-top: 2px; }
    .fotos-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .foto-slot { background: #111926; border: 1.5px solid rgba(255,255,255,0.06); border-radius: 10px; aspect-ratio: 4/3; overflow: hidden; position: relative; cursor: pointer; transition: border-color .2s; }
    .foto-slot:hover { border-color: rgba(58,155,255,0.4); }
    .foto-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .foto-slot-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-align: center; padding: 4px; color: rgba(255,255,255,0.7); font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; }
    .foto-slot-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 5px; color: #3A5070; font-size: 11px; }
    .foto-slot-empty svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; }
    .hint { font-size: 12px; color: #3A5070; text-align: center; }
    .btn-download { width: 100%; max-width: 480px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 15px; border-radius: 12px; background: linear-gradient(135deg, #0C3C6E, #1554A8, #2E85E8); color: #fff; font-size: 16px; font-weight: 600; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: filter .2s; margin-bottom: 28px; box-shadow: 0 8px 28px rgba(21,84,168,0.35); }
    .btn-download:hover { filter: brightness(1.12); }
    .btn-download:disabled { opacity: .45; cursor: not-allowed; }
    .preview-wrap { width: 100%; max-width: 360px; border-radius: 14px; overflow: hidden; border: 1px solid rgba(58,155,255,0.15); box-shadow: 0 24px 64px rgba(0,0,0,0.8); }
    .preview-wrap canvas { width: 100%; display: block; }
    #loading { text-align: center; color: #3A5070; font-size: 13px; padding: 40px; background: #0D1420; }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="/admin">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Volver al admin
    </a>
    <div class="top-title">Publicación</div>
  </div>

  <div class="controls">
    <div>
      <div class="ctrl-label">Vehículo</div>
      <div class="ctrl-veh" id="ctrl-nombre">Cargando…</div>
      <div class="ctrl-datos" id="ctrl-datos"></div>
    </div>
    <div>
      <div class="ctrl-label">Fotos — tocá para intercambiar</div>
      <div class="fotos-row">
        <div class="foto-slot" id="slot-a" onclick="swap()">
          <div class="foto-slot-empty" id="slot-a-empty">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            Sin foto
          </div>
          <div class="foto-slot-label">Principal</div>
        </div>
        <div class="foto-slot" id="slot-b" onclick="swap()">
          <div class="foto-slot-empty" id="slot-b-empty">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            Sin foto
          </div>
          <div class="foto-slot-label">Secundaria</div>
        </div>
      </div>
      <div class="hint">Tocá para intercambiar · Preview en tiempo real</div>
    </div>
  </div>

  <button class="btn-download" id="btn-dl" onclick="descargar()">
    ⬇ Descargar Publicación 1080×1350
  </button>

  <div class="preview-wrap">
    <div id="loading">Cargando…</div>
    <canvas id="cv" style="display:none"></canvas>
  </div>

  <script>
    const SB_URL = "https://okjroggxyvwmlvowdldo.supabase.co";
    const SB_KEY = "sb_publishable_wMPA_yj45_gmi0duYi6CMw_vl0jNeE8";
    const { createClient } = supabase;
    const sb = createClient(SB_URL, SB_KEY);
    const LOGO_URL = "https://okjroggxyvwmlvowdldo.supabase.co/storage/v1/object/public/assets/balizar%20fondo.jpg";

    const W = 1080, H = 1350;
    let V = null, fotos = [null, null];

    async function loadFonts() {
      const pairs = [
        ["https://fonts.gstatic.com/s/barlowcondensed/v12/HTxwL3I-JCGChYJ8VI-L6OO_au7B43LSmQ.woff2", "900"],
        ["https://fonts.gstatic.com/s/barlowcondensed/v12/HTxxL3I-JCGChYJ8VI-L6OO_au7B4973mhdSqmM.woff2", "700"],
      ];
      await Promise.all(pairs.map(([url, w]) => {
        const f = new FontFace("BC", `url(${url})`, { weight: w });
        return f.load().then(loaded => document.fonts.add(loaded)).catch(() => {});
      }));
      await document.fonts.ready;
    }

    async function loadImg(url) {
      if (!url) return null;
      return new Promise(res => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => res(img);
        img.onerror = () => { const i2 = new Image(); i2.onload = () => res(i2); i2.onerror = () => res(null); i2.src = url; };
        img.src = url;
      });
    }

    function cover(ctx, img, x, y, w, h) {
      if (!img) { ctx.fillStyle = "#111"; ctx.fillRect(x, y, w, h); return; }
      const s = Math.max(w / img.width, h / img.height);
      const sw = img.width * s, sh = img.height * s;
      ctx.save();
      ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
      ctx.drawImage(img, x + (w - sw) / 2, y + (h - sh) / 2, sw, sh);
      ctx.restore();
    }

    function gradV(ctx, x, y, w, h, stops) {
      const g = ctx.createLinearGradient(0, y, 0, y + h);
      stops.forEach(([p, c]) => g.addColorStop(p, c));
      ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    }

    function rr(ctx, x, y, w, h, r, fill, stroke, sw) {
      ctx.beginPath();
      ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
      ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
      ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
      ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = sw||2; ctx.stroke(); }
    }

    async function render(canvas) {
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext("2d");
      const v = V, cx = W / 2;
      const BC = "BC,'Arial Black',Arial";
      const DM = "'DM Sans',Arial";
      const AZUL = "#0057B8", AMARILLO = "#FFD400", BLANCO = "#FFFFFF", NEGRO = "#111111";
      const AZUL_OSC = "#001A3D";

      const [imgA, imgB, logo] = await Promise.all([
        loadImg(fotos[0]), loadImg(fotos[1]), loadImg(LOGO_URL)
      ]);

      const dominio = (v.dominio || v.rudac || "").toUpperCase();
      const marca   = (v.marca  || "").toUpperCase();
      const modelo  = (v.modelo || "").toUpperCase();

      // ══════════════════════════════════════════════════════
      // DISEÑO VEHÍCULO — estilo "Desarme Ingresado" Desbalizar
      // ══════════════════════════════════════════════════════
      if (v.anio !== undefined) {

        // ── HELPER: dibuja ícono de engranaje en canvas ──
        function drawGear(ctx, cx, cy, r, color) {
          const teeth = 8, iR = r*0.55, tW = 0.22;
          ctx.save();
          ctx.fillStyle = color;
          ctx.beginPath();
          for (let i = 0; i < teeth; i++) {
            const a0 = (i/teeth)*Math.PI*2 - tW, a1 = a0+tW, a2 = a1+tW, a3 = a2+tW;
            ctx.arc(cx, cy, iR, a0-0.05, a0+0.05);
            ctx.lineTo(cx + Math.cos(a0)*r, cy + Math.sin(a0)*r);
            ctx.arc(cx, cy, r, a0, a2, false);
            ctx.lineTo(cx + Math.cos(a2)*iR, cy + Math.sin(a2)*iR);
            ctx.arc(cx, cy, iR, a2-0.05, a2+tW*2, false);
          }
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = "#001A4D";
          ctx.beginPath(); ctx.arc(cx, cy, r*0.32, 0, Math.PI*2); ctx.fill();
          ctx.restore();
        }

        // ── HELPER: dibuja íconos del pie sin emojis ──
        function drawPieIcon(ctx, x, y, type, color) {
          ctx.save(); ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = 4;
          if (type === "shield") {
            ctx.beginPath(); ctx.moveTo(x, y-18); ctx.lineTo(x+14, y-10);
            ctx.lineTo(x+14, y+4); ctx.quadraticCurveTo(x+14,y+18,x,y+22);
            ctx.quadraticCurveTo(x-14,y+18,x-14,y+4); ctx.lineTo(x-14,y-10); ctx.closePath(); ctx.fill();
          } else if (type === "box") {
            ctx.strokeRect(x-14, y-14, 28, 28); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x-14,y-2); ctx.lineTo(x+14,y-2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x,y-14); ctx.lineTo(x,y-2); ctx.stroke();
          } else if (type === "check") {
            ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI*2); ctx.stroke();
            ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(x-8,y+1); ctx.lineTo(x-2,y+7); ctx.lineTo(x+9,y-7); ctx.stroke();
          } else if (type === "chat") {
            ctx.beginPath(); ctx.arc(x, y-2, 15, Math.PI*0.2, Math.PI*1.8); ctx.lineTo(x-6,y+14); ctx.closePath(); ctx.fill();
            ctx.fillStyle = "#001A4D";
            for (let d=-7;d<=7;d+=7) { ctx.beginPath(); ctx.arc(x+d,y-2,2.5,0,Math.PI*2); ctx.fill(); }
          }
          ctx.restore();
        }

        // ── MEDIDAS FIJAS ──
        const HDR_H   = 130;
        const FOTO1_H = 470;
        const SEP_H   = 18;
        const FOTO2_H = 420;
        const WSP_H   = 220;
        const PIE_H   = 92;
        // sanity: total = 130+470+18+420+220+92 = 1350 ✓

        // ── FONDO ──
        ctx.fillStyle = "#001235";
        ctx.fillRect(0, 0, W, H);

        // ══ HEADER ══
        ctx.fillStyle = "#002060";
        ctx.fillRect(0, 0, W, HDR_H);

        // Globo ícono — izquierda
        const gX = 52, gY = HDR_H/2;
        ctx.strokeStyle = BLANCO; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(gX, gY, 24, 0, Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(gX, gY, 11, 24, 0, 0, Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(gX-24, gY); ctx.lineTo(gX+24, gY); ctx.stroke();
        ctx.fillStyle = BLANCO;
        ctx.font = `500 32px ${DM}`;
        ctx.textAlign = "left";
        ctx.fillText("desbalizar.com.ar", gX + 34, gY + 12);

        // Logo — derecha, dibujado directo sin clip (evita bug negro)
        if (logo) {
          const LH = 80, LW = logo.width * (LH / logo.height);
          const LX = W - LW - 30, LY = (HDR_H - LH)/2;
          ctx.drawImage(logo, LX, LY, LW, LH);
        } else {
          ctx.fillStyle = BLANCO; ctx.font = `900 56px ${BC}`; ctx.textAlign = "right";
          ctx.fillText("Desbalizar", W-30, HDR_H/2+20);
          ctx.fillStyle = AMARILLO; ctx.font = `500 26px ${DM}`;
          ctx.fillText("Desarmadero · Autopartes", W-30, HDR_H/2+50);
        }

        // ══ FOTO SUPERIOR ══
        const F1Y = HDR_H;
        cover(ctx, imgA, 0, F1Y, W, FOTO1_H);

        // Degradado oscuro a la derecha para que el badge sea legible
        const vgR = ctx.createLinearGradient(W*0.45, 0, W, 0);
        vgR.addColorStop(0, "rgba(0,8,32,0)");
        vgR.addColorStop(1, "rgba(0,8,32,0.72)");
        ctx.fillStyle = vgR;
        ctx.fillRect(0, F1Y, W, FOTO1_H);

        // ── BADGE MARCA/MODELO/DESARME ──
        const BDG_W = 400, BDG_R = 18;
        // Calcular altura dinámica según longitud del modelo
        // El modelo puede necesitar 1 o 2 líneas
        let mfs2 = 110;
        ctx.font = `900 ${mfs2}px ${BC}`;
        const modelLines = [];
        if (ctx.measureText(modelo).width <= BDG_W - 32) {
          modelLines.push(modelo);
        } else {
          // partir en palabras y buscar el mejor corte
          const words = modelo.split(" ");
          let line = "";
          for (const w of words) {
            const test = line ? line+" "+w : w;
            ctx.font = `900 ${mfs2}px ${BC}`;
            if (ctx.measureText(test).width > BDG_W - 32 && line) {
              modelLines.push(line); line = w;
            } else { line = test; }
          }
          if (line) modelLines.push(line);
          // Si aún no entra en una sola línea, reducir fuente
          let maxW = 0;
          modelLines.forEach(l => { ctx.font=`900 ${mfs2}px ${BC}`; maxW = Math.max(maxW, ctx.measureText(l).width); });
          while (maxW > BDG_W-32 && mfs2>50) { mfs2-=4; ctx.font=`900 ${mfs2}px ${BC}`; maxW=0; modelLines.forEach(l=>{maxW=Math.max(maxW,ctx.measureText(l).width);}); }
        }

        const lineH2 = mfs2 + 8;
        const marcaH = 80, sepH = 8, desarmeH = 100, padV = 28;
        const BDG_H = padV + marcaH + sepH + 14 + lineH2*modelLines.length + padV/2 + desarmeH;
        const BDG_X = W - BDG_W - 28;
        const BDG_Y = F1Y + (FOTO1_H - BDG_H)/2;

        rr(ctx, BDG_X, BDG_Y, BDG_W, BDG_H, BDG_R, "#001A4D");
        rr(ctx, BDG_X, BDG_Y, BDG_W, BDG_H, BDG_R, null, AMARILLO, 3.5);

        const bcx = BDG_X + BDG_W/2;
        let curY = BDG_Y + padV;

        // Marca
        let mfs = 74;
        ctx.font = `900 ${mfs}px ${BC}`;
        while (ctx.measureText(marca).width > BDG_W-32 && mfs>40) { mfs-=3; ctx.font=`900 ${mfs}px ${BC}`; }
        ctx.fillStyle = BLANCO; ctx.textAlign = "center";
        ctx.fillText(marca, bcx, curY + mfs*0.78);
        curY += marcaH + 4;

        // Separador
        ctx.fillStyle = AMARILLO;
        ctx.fillRect(BDG_X+24, curY, BDG_W-48, 4);
        curY += 4 + 16;

        // Modelo (una o dos líneas)
        ctx.fillStyle = AMARILLO;
        ctx.font = `900 ${mfs2}px ${BC}`;
        modelLines.forEach(l => { ctx.fillText(l, bcx, curY + mfs2*0.82); curY += lineH2; });
        curY += 6;

        // DESARME INGRESADO con engranaje
        const gearCX = BDG_X + 52, gearCY = curY + 36;
        drawGear(ctx, gearCX, gearCY, 26, AMARILLO);
        ctx.fillStyle = BLANCO;
        ctx.font = `800 46px ${BC}`;
        ctx.textAlign = "left";
        ctx.fillText("DESARME", gearCX + 38, curY + 28);
        ctx.fillText("INGRESADO", gearCX + 38, curY + 76);

        // ══ SEPARADOR DOBLE LÍNEA AMARILLA ══
        const SEP_Y = F1Y + FOTO1_H;
        ctx.fillStyle = AMARILLO;
        ctx.fillRect(0, SEP_Y, W, SEP_H);
        ctx.fillStyle = "#001235";
        ctx.fillRect(0, SEP_Y + 4, W, 4);

        // ══ FOTO INFERIOR ══
        const F2Y = SEP_Y + SEP_H;
        cover(ctx, imgB || imgA, 0, F2Y, W, FOTO2_H);

        // ══ ZONA WHATSAPP (blanca) ══
        const WSP_Y = F2Y + FOTO2_H;
        ctx.fillStyle = BLANCO;
        ctx.fillRect(0, WSP_Y, W, WSP_H);

        // Texto "PEDÍ LA PIEZA QUE NECESITÁS"
        ctx.font = `800 58px ${BC}`;
        const txtBefore = "PEDÍ LA ";
        const txtPieza  = "PIEZA";
        const txtAfter  = " QUE NECESITÁS";
        const wBefore = ctx.measureText(txtBefore).width;
        const wPieza  = ctx.measureText(txtPieza).width;
        const wAfter  = ctx.measureText(txtAfter).width;
        const wTotal  = wBefore + wPieza + wAfter;
        let tx0 = cx - wTotal/2;
        const textY = WSP_Y + 76;
        ctx.textAlign = "left";
        ctx.fillStyle = "#111"; ctx.fillText(txtBefore, tx0, textY);
        ctx.fillStyle = AZUL;   ctx.fillText(txtPieza,  tx0+wBefore, textY);
        ctx.fillStyle = "#111"; ctx.fillText(txtAfter,  tx0+wBefore+wPieza, textY);

        // Fila WhatsApp: ícono + número
        const ROW_Y = WSP_Y + 150;
        // Círculo verde
        const wpX = 100, wpY = ROW_Y;
        ctx.beginPath(); ctx.arc(wpX, wpY, 58, 0, Math.PI*2);
        ctx.fillStyle = "#25D366"; ctx.fill();
        // Burbuja WhatsApp: cuerpo redondo + colita
        ctx.fillStyle = BLANCO;
        ctx.beginPath(); ctx.arc(wpX, wpY-4, 32, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#25D366";
        ctx.font = `900 52px ${BC}`; ctx.textAlign = "center";
        ctx.fillText("W", wpX, wpY+14);
        ctx.fillStyle = BLANCO;
        ctx.font = `900 52px ${BC}`;
        ctx.fillText("W", wpX, wpY+13);

        // Número
        ctx.fillStyle = "#002060";
        ctx.font = `900 128px ${BC}`;
        ctx.textAlign = "left";
        ctx.fillText("2314 545224", wpX + 76, ROW_Y + 48);

        // Flecha amarilla ↘
        ctx.fillStyle = AMARILLO;
        ctx.font = `bold 70px ${DM}`;
        ctx.textAlign = "right";
        ctx.fillText("↘", W - 24, ROW_Y + 55);

        // ══ PIE — 4 beneficios sin emojis ══
        const PIE_Y = WSP_Y + WSP_H;
        ctx.fillStyle = "#002060";
        ctx.fillRect(0, PIE_Y, W, PIE_H);

        const beneficios = [
          { type:"shield", label:"COMPRA SEGURA",       sub:"Protegemos tu compra" },
          { type:"box",    label:"ENVÍOS A TODO EL PAÍS", sub:"Rapidez y confianza" },
          { type:"check",  label:"GARANTÍA DE ORIGEN",  sub:"Piezas verificadas" },
          { type:"chat",   label:"ATENCIÓN PERSONALIZADA", sub:"Te asesoramos siempre" },
        ];
        const colW = W / 4;
        beneficios.forEach((b, i) => {
          const bx = colW * i + colW/2;
          if (i > 0) {
            ctx.fillStyle = "rgba(255,255,255,0.18)";
            ctx.fillRect(colW*i, PIE_Y+12, 1, PIE_H-24);
          }
          drawPieIcon(ctx, bx, PIE_Y + 28, b.type, AMARILLO);
          ctx.textAlign = "center";
          ctx.fillStyle = BLANCO;
          // Partir label si es muy largo
          ctx.font = `700 22px ${BC}`;
          const words = b.label.split(" ");
          let lines = [], cur = "";
          words.forEach(w => {
            const test = cur ? cur+" "+w : w;
            if (ctx.measureText(test).width > colW-18 && cur) { lines.push(cur); cur=w; } else cur=test;
          });
          if (cur) lines.push(cur);
          const lineStart = PIE_Y + 56;
          lines.forEach((l,li) => ctx.fillText(l, bx, lineStart + li*24));
          ctx.fillStyle = "rgba(255,255,255,0.5)";
          ctx.font = `400 17px ${DM}`;
          ctx.fillText(b.sub, bx, lineStart + lines.length*24 + 4);
        });

      } else {
        // ══════════════════════════════════════════════════════
        // DISEÑO MOTOR — una foto, zona blanca con info abajo
        // ══════════════════════════════════════════════════════
        const FOTO_H = 850;
        ctx.fillStyle = BLANCO;
        ctx.fillRect(0, 0, W, H);
        cover(ctx, imgA, 0, 0, W, FOTO_H);
        gradV(ctx, 0, FOTO_H-340, W, 340, [[0,"rgba(0,0,0,0)"],[1,"rgba(0,0,0,0.78)"]]);

        ctx.textAlign = "center";
        ctx.shadowColor = "rgba(0,0,0,.7)"; ctx.shadowBlur = 20;
        ctx.fillStyle = AMARILLO;
        ctx.font = `900 105px ${BC}`;
        ctx.fillText(marca, cx, FOTO_H-165);

        let mfs = 82;
        ctx.font = `800 ${mfs}px ${BC}`;
        while (ctx.measureText(modelo).width > W-80 && mfs>46) { mfs-=3; ctx.font=`800 ${mfs}px ${BC}`; }
        ctx.fillStyle = BLANCO;
        ctx.fillText(modelo, cx, FOTO_H-72);
        ctx.shadowBlur = 0;

        if (dominio) {
          rr(ctx, 40, 40, 260, 90, 12, BLANCO, "#D9D9D9", 1);
          ctx.fillStyle = NEGRO; ctx.font=`800 56px ${BC}`; ctx.textAlign="left";
          ctx.fillText(dominio, 65, 100);
        }
        if (logo) {
          const LR=75, LX=W-LR-28, LY=LR+28;
          ctx.save(); ctx.beginPath(); ctx.arc(LX,LY,LR,0,Math.PI*2); ctx.clip();
          ctx.drawImage(logo,LX-LR,LY-LR,LR*2,LR*2); ctx.restore();
          ctx.beginPath(); ctx.arc(LX,LY,LR+4,0,Math.PI*2);
          ctx.strokeStyle=AMARILLO; ctx.lineWidth=4; ctx.stroke();
        }

        ctx.fillStyle = BLANCO;
        ctx.fillRect(0, FOTO_H, W, H-FOTO_H);
        rr(ctx, 40, FOTO_H+40, W-80, 90, 16, AZUL);
        ctx.fillStyle=BLANCO; ctx.font=`900 52px ${BC}`; ctx.textAlign="center";
        ctx.fillText("AUTOPARTES DISPONIBLES", cx, FOTO_H+100);

        const piezas = ["MOTOR","CAJA","CHAPA","INTERIOR"];
        ctx.textAlign="left";
        piezas.forEach((p,i) => {
          const py = FOTO_H+185+i*60;
          ctx.fillStyle=AZUL; ctx.font=`800 42px ${BC}`; ctx.fillText("✓", 80, py);
          ctx.fillStyle=NEGRO; ctx.font=`700 42px ${BC}`; ctx.fillText(p, 148, py);
        });

        ctx.fillStyle=AZUL; ctx.font=`900 60px ${BC}`; ctx.textAlign="center";
        ctx.fillText("2314 545224", cx, FOTO_H+500);
        rr(ctx, 100, FOTO_H+520, W-200, 66, 12, AMARILLO);
        ctx.fillStyle=NEGRO; ctx.font=`800 38px ${BC}`; ctx.textAlign="center";
        ctx.fillText("3 CUOTAS SIN INTERÉS", cx, FOTO_H+564);

        ctx.fillStyle=AZUL; ctx.fillRect(0, H-90, W, 90);
        ctx.fillStyle=BLANCO; ctx.font=`700 34px ${BC}`; ctx.textAlign="center";
        ctx.fillText("DESBALIZAR S.A. · BOLÍVAR · BUENOS AIRES", cx, H-32);
      }
    }

    async function actualizarPreview() {
      const cv = document.getElementById("cv");
      const ld = document.getElementById("loading");
      ld.style.display = "block"; cv.style.display = "none";
      await render(cv);
      ld.style.display = "none"; cv.style.display = "block";
    }

    function swap() {
      [fotos[0], fotos[1]] = [fotos[1], fotos[0]];
      actualizarSlots();
      actualizarPreview();
    }

    function actualizarSlots() {
      [["a",0],["b",1]].forEach(([s,i]) => {
        const slot  = document.getElementById("slot-"+s);
        const empty = document.getElementById("slot-"+s+"-empty");
        const url   = fotos[i];
        const old   = slot.querySelector("img");
        if (url) {
          empty.style.display = "none";
          if (old) { old.src = url; } else {
            const img = document.createElement("img");
            img.src = url;
            slot.insertBefore(img, slot.querySelector(".foto-slot-label"));
          }
        } else {
          empty.style.display = "flex";
          if (old) old.remove();
        }
      });
    }

    async function descargar() {
      const btn = document.getElementById("btn-dl");
      btn.disabled = true; btn.textContent = "Generando…";
      const cv = document.createElement("canvas");
      await render(cv);
      const nombre = "post_"+(V.marca||"").toLowerCase()+"_"+(V.modelo||"").toLowerCase().replace(/\s+/g,"_")+".jpg";
      cv.toBlob(blob => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = nombre; a.click();
        URL.revokeObjectURL(a.href);
        btn.disabled = false;
        btn.textContent = "⬇ Descargar Publicación 1080×1350";
      }, "image/jpeg", 0.95);
    }

    async function init() {
      await loadFonts();
      const id = new URLSearchParams(location.search).get("id");
      if (!id) return;
      const { data } = await sb.from("vehiculos").select("*").eq("id", id).single();
      if (!data) return;
      V = data;
      fotos = Array.isArray(data.fotos) ? [data.fotos[0]||null, data.fotos[1]||null] : [null,null];
      document.getElementById("ctrl-nombre").textContent = (data.marca||"")+" "+(data.modelo||"");
      const d = [data.anio, data.km ? Number(data.km).toLocaleString("es-AR")+" km" : null].filter(Boolean).join(" · ");
      document.getElementById("ctrl-datos").textContent = d;
      actualizarSlots();
      await actualizarPreview();
    }

    init();
  </script>
</body>
</html>
